<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="stylesheet" href="/styles/page.css" />
        <link rel="stylesheet" href="/styles/reset.css" />
        <script type="importmap">
            {"imports": {
                "@unbndl/html": "https://unpkg.com/@unbndl/html",
                "@unbndl/auth": "https://unpkg.com/@unbndl/auth",
                "@unbndl/view": "https://unpkg.com/@unbndl/view"
            }}
        </script>
        <script type="module">
            import { define } from "@unbndl/html";
            import { Auth } from "@unbndl/auth";
            import { ZoneItem } from "./js/navigation_options.js";
            import { ZoneElement } from "./js/elementsGet.js";
            import { HeaderElement } from "/js/header.js";

            define({
                "zone-item": ZoneItem,
                "zone-list": ZoneElement,
                "plant-header": HeaderElement,
                "auth-provider": Auth.Provider
            });
        </script>
    </head>

    <body>
        <auth-provider>
            <plant-header></plant-header>

            <main class="page">
                <zone-list></zone-list>

                <p>
                    <a href="./alerts.html">Alerts</a>
                </p>

                <div class="dropFlex">
                    <div class="dropdown">Component Details
                        <div class="dropdown-content">
                            <dl>
                                <dt><b>Moisture Sensor</b></dt>
                                <dd>Capacitive Soil Moisture Sensor v1.2</dd>

                                <dt><b>Temperature Sensor</b></dt>
                                <dd>DS18B20 digital temperature sensor</dd>

                                <dt><b>Watering Pump</b></dt>
                                <dd>Submersible 3V DC Water Pump, Horizontal Type</dd>
                            </dl>
                        </div>
                    </div>
                </div>
            </main>
        </auth-provider>

        <script>
            document.body.addEventListener("dark-mode", (event) => {
                document.body.classList.toggle("dark-mode", event.detail.checked);
            });
        </script>

    </body>
</html>
