<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="utf-8" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

        <link rel="stylesheet" href="/styles/page.css" />
        <link rel="stylesheet" href="/styles/reset.css" />

        <script type="importmap">
        {
            "imports": {
                "@unbndl/html": "https://unpkg.com/@unbndl/html",
                "@unbndl/view": "https://unpkg.com/@unbndl/view",
                "@unbndl/auth": "https://unpkg.com/@unbndl/auth"
            }
        }
        </script>

        <script type="module"> 
            import { HeaderElement } from "./js/header.js";
            import { ZoneItem } from "./js/navigation_options.js";
            import { ZoneElement } from "./js/elementsGet.js";
            import { define } from "@unbndl/html";

            define({
                "site-header": HeaderElement,
                "zone-item": ZoneItem,
                "zone-list": ZoneElement
            });
        </script>

        <script>
            window.addEventListener("DOMContentLoaded", () => {
                document.body.addEventListener("dark-mode", (event) => {
                    document.body.classList.toggle("dark-mode", event.detail.checked);
                });
            });
        </script>
    </head>

    <body>
        <site-header api-src="/api/zones"></site-header>

        <zone-list src="./data/zoneList.json" api-src="/api/zones"></zone-list>

        <!-- <section class="home-links">
            <a href="./alerts.html">Alerts</a>
        </section> -->

        <section class="component-section">
            <h2>Components Used</h2>

            <div class="component-grid">
                <article class="component-card">
                    <h3>Moisture Sensor</h3>
                    <p>Capacitive Soil Moisture Sensor v1.2</p>
                </article>

                <article class="component-card">
                    <h3>Temperature Sensor</h3>
                    <p>DS18B20 digital temperature sensor</p>
                </article>

                <article class="component-card">
                    <h3>Watering Pump</h3>
                    <p>Submersible 3V DC Water Pump, Horizontal Type</p>
                </article>
            </div>
        </section>
    </body>
</html>
